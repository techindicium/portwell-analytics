# contract: metric-definitions
# owner: P-SOF
# published_at: 2026-08-20
# note: This file is the source. Assist engineering and Reporting both consume it. Consumers
#       are expected to pin a version. Nothing checks that they do.

metrics:
  - name: deflection_rate
    version: 3
    definition: >
      Share of tickets in the period closed without a human authoring the answer body.
    grain: account-day
    numerator: tickets where proposal_sent is true and human_edit_material is false
    denominator: tickets closed in the period
    excludes: tickets reopened within 48 hours
    owner: P-SOF
    effective_from: 2026-07-01
    supersedes: 2

  - name: deflection_rate
    version: 2
    definition: >
      Share of tickets in the period closed without a human authoring the answer body.
    grain: account-day
    numerator: tickets where proposal_sent is true
    denominator: tickets closed in the period
    excludes: nothing
    owner: P-SOF
    effective_from: 2026-04-01
    superseded_by: 3
    status: superseded

  - name: first_response_minutes_p50
    version: 1
    definition: >
      Median minutes between ticket creation and the first outbound interaction.
    grain: account-period
    owner: P-SOF
    effective_from: 2026-02-01
    minimum_denominator: 20

  - name: proposal_acceptance_rate
    version: 1
    definition: >
      Share of proposals sent without material edit, of proposals created.
    grain: account-period
    owner: P-SOF
    effective_from: 2026-06-15
